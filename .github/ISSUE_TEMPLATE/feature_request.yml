name: Feature request
description: Suggest a focused improvement to the plugin.
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Please describe one focused use case. Do not include credentials or private logs.
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What user problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest behavior that would address the use case.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and the README before opening this request.
          required: true
        - label: I removed credentials, tokens, certificates, and sensitive host details.
          required: true
