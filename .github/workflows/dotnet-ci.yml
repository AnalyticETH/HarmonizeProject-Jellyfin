name: .NET CI/CD

on:
  push:
    branches: [ main ]
  # Permit an operator to recover a transient Actions startup failure on the
  # trusted default branch without changing release publication semantics.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jellyfin-hue-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_VERSION: '8.0.424'
  BUILD_CONFIGURATION: 'Release'
  # The self-hosted runner uses the dedicated, least-privileged
  # `harmonize-runner` service account.
  DOTNET_INSTALL_DIR: /var/lib/harmonize-runner/home/.dotnet

jobs:
  build-and-test:
    name: Build and Test
    if: github.ref == 'refs/heads/main'
    runs-on: ["self-hosted", "Linux", "X64", "harmonizeproject-jellyfin"]
    # Bound persistent-runner occupancy if a restore, test, or external tool stalls.
    timeout-minutes: 20
    env:
      # Codecov is optional for installations that do not provision an upload token.
      # Keep only a non-secret presence flag at job scope so build and test steps never
      # inherit the upload credential; the token is injected into the upload action only.
      CODECOV_TOKEN_PRESENT: ${{ secrets.CODECOV_TOKEN != '' }}

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0  # Shallow clones disabled for better analysis
        persist-credentials: false

    - name: Validate pinned .NET SDK parity
      run: node scripts/validate-dotnet-sdk.mjs

    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Cache NuGet packages
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/packages.lock.json') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore dependencies
      run: dotnet restore --locked-mode

    - name: Build solution
      run: dotnet build --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore

    - name: Preflight FFmpeg capability
      run: |
        set -euo pipefail
        ffmpeg_path="$(command -v ffmpeg || true)"
        if [ -z "$ffmpeg_path" ]; then
          echo "FFmpeg is required on the self-hosted runner but was not found on PATH." >&2
          exit 1
        fi
        timeout --kill-after=5s 15s "$ffmpeg_path" -version >/dev/null 2>&1
        pcm_path="$RUNNER_TEMP/hue-audio-preflight.pcm"
        error_path="$RUNNER_TEMP/hue-audio-preflight.err"
        timeout --kill-after=5s 15s "$ffmpeg_path" \
          -hide_banner -loglevel error -nostdin \
          -f lavfi -i "sine=frequency=440:sample_rate=8000:duration=0.15" \
          -map 0:a:0 -vn -sn -dn -ar 8000 -ac 2 -c:a pcm_s16le \
          -f s16le -t 0.15 pipe:1 >"$pcm_path" 2>"$error_path"
        pcm_bytes="$(wc -c <"$pcm_path")"
        if [ "$pcm_bytes" -lt 800 ]; then
          echo "FFmpeg PCM preflight returned only $pcm_bytes bytes; at least 800 were expected." >&2
          sed -n '1,20p' "$error_path" >&2 || true
          exit 1
        fi
        echo "FFmpeg preflight passed: $ffmpeg_path ($pcm_bytes PCM bytes)."

    - name: Run tests
      run: dotnet test --configuration ${{ env.BUILD_CONFIGURATION }} --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx" --collect:"XPlat Code Coverage" --results-directory ./TestResults

    - name: Validate administrator configuration page
      run: node scripts/validate-config-page.mjs

    - name: Test configuration export lifecycles
      run: node scripts/test-config-page-exports.mjs

    - name: Validate release documentation and package contract
      run: node scripts/validate-release-docs.mjs

    - name: Validate Dependabot coverage contract
      run: node scripts/validate-dependabot.mjs

    - name: Validate pull-request workflow boundary
      run: node scripts/validate-pull-request-workflow.mjs

    - name: Validate workflow inventory and runner boundaries
      run: node scripts/validate-workflow-inventory.mjs

    - name: Validate trusted workflow boundary
      run: node scripts/validate-trusted-workflow.mjs

    - name: Validate deterministic release package
      run: node scripts/validate-release-package.mjs

    - name: Validate preview API documentation and route contract
      run: node scripts/validate-api-docs.mjs

    - name: Upload test results
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: test-results
        path: ./TestResults/*.trx
        retention-days: 30

    - name: Upload code coverage artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: code-coverage
        path: ./TestResults/**/coverage.cobertura.xml
        retention-days: 30

    - name: Report coverage publication status
      if: always()
      run: |
        if [ "${CODECOV_TOKEN_PRESENT:-false}" = "true" ]; then
          echo "Codecov upload enabled; the coverage artifact is also retained for download." >> "$GITHUB_STEP_SUMMARY"
        else
          echo "Codecov upload skipped: CODECOV_TOKEN is not configured; the coverage artifact is retained for download." >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Upload coverage to Codecov
      if: env.CODECOV_TOKEN_PRESENT == 'true'
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f
      with:
        files: ./TestResults/**/coverage.cobertura.xml
        flags: unittests
        name: jellyfin-hue-coverage
        fail_ci_if_error: true
        verbose: true
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    - name: Publish plugin
      run: dotnet publish Jellyfin.Plugin.Hue/Jellyfin.Plugin.Hue.csproj --configuration ${{ env.BUILD_CONFIGURATION }} --no-build --output ./publish

    - name: Upload build artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: jellyfin-plugin-hue
        path: ./publish/
        retention-days: 90

    - name: Generate build summary
      if: always()
      env:
        BUILD_CONFIGURATION_VALUE: ${{ env.BUILD_CONFIGURATION }}
        DOTNET_VERSION_VALUE: ${{ env.DOTNET_VERSION }}
        COMMIT_SHA: ${{ github.sha }}
        BRANCH_NAME: ${{ github.ref_name }}
      run: |
        echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- **Configuration:** $BUILD_CONFIGURATION_VALUE" >> $GITHUB_STEP_SUMMARY
        echo "- **.NET Version:** $DOTNET_VERSION_VALUE" >> $GITHUB_STEP_SUMMARY
        echo "- **Commit:** $COMMIT_SHA" >> $GITHUB_STEP_SUMMARY
        echo "- **Branch:** $BRANCH_NAME" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        if [ -f "./TestResults/test-results.trx" ]; then
          echo "✅ Tests completed" >> $GITHUB_STEP_SUMMARY
        else
          echo "⚠️ No test results found" >> $GITHUB_STEP_SUMMARY
        fi

  code-quality:
    name: Code Quality Checks
    if: github.ref == 'refs/heads/main'
    runs-on: ["self-hosted", "Linux", "X64", "harmonizeproject-jellyfin"]
    needs: build-and-test
    timeout-minutes: 15

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false

    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore --locked-mode

    - name: Run dotnet format check
      run: dotnet format --verify-no-changes --no-restore --verbosity diagnostic

    - name: Security scan with .NET tools
      run: |
        set -euo pipefail
        dotnet list Jellyfin.Plugin.Hue.sln package --vulnerable --include-transitive --format json --output-version 1 > vulnerable-packages.json
        test -s vulnerable-packages.json
        jq -e 'type == "object" and .version == 1 and (.projects | type == "array" and length > 0)' vulnerable-packages.json >/dev/null
        vulnerable_count=$(jq '[.projects[]?.frameworks[]? | (.topLevelPackages[]?, .transitivePackages[]?) | select((.vulnerabilities // []) | length > 0)] | length' vulnerable-packages.json)
        echo "NuGet vulnerable package entries: $vulnerable_count" >> "$GITHUB_STEP_SUMMARY"
        if [ "$vulnerable_count" -ne 0 ]; then
          echo "Vulnerable packages detected; see vulnerable-packages.json for details." >&2
          exit 1
        fi

    - name: Upload security scan results
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: security-scan
        path: vulnerable-packages.json
        retention-days: 30

  security-analysis:
    name: Blocking Security Analysis
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/security-scan.yml
    permissions:
      contents: read

  create-release-package:
    name: Create Release Package
    runs-on: ["self-hosted", "Linux", "X64", "harmonizeproject-jellyfin"]
    needs: [build-and-test, code-quality, security-analysis]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 15

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false

    - name: Download tested build artifact
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: jellyfin-plugin-hue
        path: tested-publish

    - name: Create plugin package
      run: |
        mkdir -p release-package
        # Include the plugin assembly, its managed DTLS dependency, and meta.json.
        cp tested-publish/Jellyfin.Plugin.Hue.dll release-package/
        cp tested-publish/BouncyCastle.Cryptography.dll release-package/
        cp tested-publish/meta.json release-package/
        META_VERSION=$(jq -er '.version | strings | select(test("^[0-9]+\\.[0-9]+\\.[0-9]+\\.[0-9]+$"))' tested-publish/meta.json)
        SOURCE_META_VERSION=$(jq -er '.version | strings | select(test("^[0-9]+\\.[0-9]+\\.[0-9]+\\.[0-9]+$"))' meta.json)
        PROJECT_VERSION=$(sed -n 's/.*<Version>\([^<]*\)<\/Version>.*/\1/p' Jellyfin.Plugin.Hue/Jellyfin.Plugin.Hue.csproj | head -n 1)
        printf '%s\n' "$PROJECT_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$'
        test -n "$META_VERSION" && test "$META_VERSION" = "$SOURCE_META_VERSION" && test "$META_VERSION" = "$PROJECT_VERSION"
        test -f release-package/Jellyfin.Plugin.Hue.dll
        test -f release-package/BouncyCastle.Cryptography.dll
        test -f release-package/meta.json

    - name: Create zip archive
      run: |
        set -euo pipefail
        python3 scripts/create-deterministic-release-zip.py \
          --input-dir release-package \
          --output jellyfin-plugin-hue-release.zip
        test "$(unzip -Z1 jellyfin-plugin-hue-release.zip | sort | tr '\n' ' ')" = "BouncyCastle.Cryptography.dll Jellyfin.Plugin.Hue.dll meta.json "
        sha256sum jellyfin-plugin-hue-release.zip > jellyfin-plugin-hue-release.zip.sha256
        sha256sum --check --strict jellyfin-plugin-hue-release.zip.sha256
        python3 scripts/create-release-manifest.py \
          --package-dir release-package \
          --lock-file Jellyfin.Plugin.Hue/packages.lock.json \
          --archive jellyfin-plugin-hue-release.zip \
          --version "$(jq -er '.version' release-package/meta.json)" \
          --source-commit "$GITHUB_SHA" \
          --output jellyfin-plugin-hue-release.manifest.json
        sha256sum jellyfin-plugin-hue-release.manifest.json > jellyfin-plugin-hue-release.manifest.json.sha256
        sha256sum --check --strict jellyfin-plugin-hue-release.manifest.json.sha256

    - name: Upload release package
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: release-package
        path: |
          jellyfin-plugin-hue-release.zip
          jellyfin-plugin-hue-release.zip.sha256
          jellyfin-plugin-hue-release.manifest.json
          jellyfin-plugin-hue-release.manifest.json.sha256
        retention-days: 90

    - name: Generate release notes
      env:
        COMMIT_SHA: ${{ github.sha }}
        BRANCH_NAME: ${{ github.ref_name }}
      run: |
        echo "# Jellyfin Plugin Hue - Release Package" > release-notes.md
        echo "" >> release-notes.md
        echo "## Build Information" >> release-notes.md
        echo "- **Commit:** $COMMIT_SHA" >> release-notes.md
        echo "- **Date:** $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> release-notes.md
        echo "- **Branch:** $BRANCH_NAME" >> release-notes.md
        echo "" >> release-notes.md
        echo "## Installation" >> release-notes.md
        echo "1. Download the release package" >> release-notes.md
        echo "2. Verify the ZIP with its SHA-256 sidecar" >> release-notes.md
        echo "3. Optionally inspect the release manifest and its checksum for package/dependency provenance" >> release-notes.md
        echo "4. Extract to your Jellyfin plugins directory" >> release-notes.md
        echo "5. Restart Jellyfin" >> release-notes.md

    - name: Upload release notes
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: release-notes
        path: release-notes.md
        retention-days: 90

  validate-release-helper:
    name: Validate Linux Release Helper
    runs-on: ["self-hosted", "Linux", "X64", "harmonizeproject-jellyfin"]
    needs: create-release-package
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 20

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false

    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Download canonical release package
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: release-package
        # Keep downloaded artifacts outside the checkout so the helper's
        # clean-checkout provenance guard sees only committed source files.
        path: ${{ runner.temp }}/trusted-release-package

    - name: Run documented Linux release helper
      run: |
        set -euo pipefail
        chmod +x ./build-release.sh
        ./build-release.sh

    - name: Verify helper package parity
      run: |
        set -euo pipefail
        : "${RUNNER_TEMP:?RUNNER_TEMP is required for canonical artifact verification}"
        CANONICAL_PACKAGE_DIR="$RUNNER_TEMP/trusted-release-package"
        VERSION=$(jq -er '.version | strings | select(test("^[0-9]+\\.[0-9]+\\.[0-9]+\\.[0-9]+$"))' meta.json)
        HELPER_ZIP="jellyfin-plugin-hue-v${VERSION}.zip"
        HELPER_CHECKSUM="${HELPER_ZIP}.sha256"
        HELPER_MANIFEST="jellyfin-plugin-hue-v${VERSION}.manifest.json"
        HELPER_MANIFEST_CHECKSUM="${HELPER_MANIFEST}.sha256"
        test -f "$HELPER_ZIP"
        test -f "$HELPER_CHECKSUM"
        test -f "$HELPER_MANIFEST"
        test -f "$HELPER_MANIFEST_CHECKSUM"
        sha256sum --check --strict "$HELPER_CHECKSUM"
        sha256sum --check --strict "$HELPER_MANIFEST_CHECKSUM"
        EXPECTED_ENTRIES="BouncyCastle.Cryptography.dll Jellyfin.Plugin.Hue.dll meta.json "
        test "$(unzip -Z1 "$HELPER_ZIP" | sort | tr '\n' ' ')" = "$EXPECTED_ENTRIES"
        test "$(unzip -Z1 "$CANONICAL_PACKAGE_DIR/jellyfin-plugin-hue-release.zip" | sort | tr '\n' ' ')" = "$EXPECTED_ENTRIES"
        unzip -p "$HELPER_ZIP" meta.json > helper-meta.json
        unzip -p "$CANONICAL_PACKAGE_DIR/jellyfin-plugin-hue-release.zip" meta.json > canonical-meta.json
        test "$(jq -er '.version' helper-meta.json)" = "$VERSION"
        test "$(jq -er '.version' canonical-meta.json)" = "$VERSION"
        cmp -s helper-meta.json canonical-meta.json
        (cd "$CANONICAL_PACKAGE_DIR" && sha256sum --check --strict jellyfin-plugin-hue-release.zip.sha256)
        (cd "$CANONICAL_PACKAGE_DIR" && sha256sum --check --strict jellyfin-plugin-hue-release.manifest.json.sha256)
        cmp -s "$HELPER_MANIFEST" "$CANONICAL_PACKAGE_DIR/jellyfin-plugin-hue-release.manifest.json"
        echo "Linux release helper produced a verified ${VERSION} package and matching release manifest."

  create-github-release:
    name: Create GitHub Release
    # Keep the contents:write token off the persistent build/test identity.
    runs-on: ["self-hosted", "Linux", "X64", "harmonizeproject-jellyfin-release"]
    needs: [create-release-package, validate-release-helper]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false

    - name: Extract version from meta.json
      id: version
      run: |
        VERSION=$(jq -er '.version | strings | select(test("^[0-9]+\\.[0-9]+\\.[0-9]+\\.[0-9]+$"))' meta.json)
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "tag=v$VERSION" >> $GITHUB_OUTPUT
        echo "Detected version: $VERSION"

    - name: Download release package
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: release-package
        path: ./

    - name: Verify release package checksum
      run: |
        set -euo pipefail
        sha256sum --check --strict jellyfin-plugin-hue-release.zip.sha256
        sha256sum --check --strict jellyfin-plugin-hue-release.manifest.json.sha256
        jq -e --arg source_commit "$GITHUB_SHA" '(.schemaVersion == 2) and (.pluginVersion | type == "string") and (.sourceCommit == $source_commit) and ((.packageFiles | length) == 3) and ((.nuget.packages | length) > 0)' jellyfin-plugin-hue-release.manifest.json >/dev/null

    - name: Extract changelog for current version
      id: changelog
      env:
        RELEASE_VERSION: ${{ steps.version.outputs.version }}
      run: |
        VERSION="$RELEASE_VERSION"
        if [ -f CHANGELOG.md ]; then
          # Metadata uses four-part assembly versions while the changelog uses SemVer.
          CHANGELOG_VERSION="$VERSION"
          if ! grep -q "## \[${CHANGELOG_VERSION}\]" CHANGELOG.md; then
            CHANGELOG_VERSION="${VERSION%.0}"
          fi
          CHANGES=$(sed -n "/## \[${CHANGELOG_VERSION}\]/,/## \[/p" CHANGELOG.md | sed '$d' | tail -n +2)
          if [ -z "$CHANGES" ]; then
            CHANGES="See CHANGELOG.md for details."
          fi
        else
          CHANGES=$(jq -r '.changelog // "See CHANGELOG.md for details."' meta.json)
        fi
        echo "changes<<EOF" >> $GITHUB_OUTPUT
        echo "$CHANGES" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

    - name: Pin release tag to workflow commit
      env:
        RELEASE_TAG: ${{ steps.version.outputs.tag }}
        RELEASE_SHA: ${{ github.sha }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        TAG="$RELEASE_TAG"
        SHA="$RELEASE_SHA"
        local_tag_ref="refs/tags/${TAG}"
        export GIT_CONFIG_COUNT=1
        export GIT_CONFIG_KEY_0=http.extraheader
        export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
        set +e
        remote_tag_info="$(git ls-remote --refs origin "refs/tags/${TAG}" 2>&1)"
        lookup_status=$?
        set -e
        if [ "$lookup_status" -ne 0 ]; then
          echo "Could not verify release tag ${TAG}; refusing to publish." >&2
          echo "$remote_tag_info" >&2
          exit "$lookup_status"
        fi

        remote_tag_sha="$(printf '%s\n' "$remote_tag_info" | awk 'NR == 1 { print $1 }')"
        if [ -n "$remote_tag_sha" ]; then
          if [ "$remote_tag_sha" != "$SHA" ]; then
            echo "Release tag ${TAG} already points to ${remote_tag_sha}, expected workflow commit ${SHA}; refusing to publish." >&2
            exit 1
          fi

          echo "Release tag ${TAG} already points to workflow commit ${SHA}."
        else
          if git show-ref --verify --quiet "$local_tag_ref"; then
            echo "Removing stale local release tag ${TAG}; the remote tag is absent."
            git tag -d "$TAG"
          fi

          git tag --no-sign "$TAG" "$SHA"
          git push origin "refs/tags/${TAG}"
          created_tag_sha="$(git ls-remote --refs origin "refs/tags/${TAG}")"
          created_tag_sha="$(printf '%s\n' "$created_tag_sha" | awk 'NR == 1 { print $1 }')"
          test "$created_tag_sha" = "$SHA"
          echo "Created release tag ${TAG} at workflow commit ${SHA}."
        fi

    - name: Create GitHub Release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RELEASE_VERSION: ${{ steps.version.outputs.version }}
        RELEASE_TAG: ${{ steps.version.outputs.tag }}
        RELEASE_SHA: ${{ github.sha }}
        CHANGELOG_TEXT: ${{ steps.changelog.outputs.changes }}
      run: |
        set -euo pipefail

        # Keep release publication idempotent. GitHub can accept the release
        # record or the first asset and then return a transient gateway error;
        # retries must resume that draft instead of creating a second release.
        retry() {
          local attempt delay failure_status
          delay=5
          for attempt in 1 2 3 4 5 6; do
            if "$@"; then
              return 0
            else
              failure_status=$?
            fi
            if [ "$attempt" -eq 6 ]; then
              return "$failure_status"
            fi
            echo "GitHub release operation failed (attempt $attempt/6); retrying in ${delay}s..." >&2
            sleep "$delay"
            delay=$((delay * 2))
          done
        }

        body_file="$RUNNER_TEMP/hue-release-body.md"
        {
          printf '## Jellyfin Philips Hue Sync Plugin v%s\n\n' "$RELEASE_VERSION"
          printf '### Changes\n\n%s\n\n' "$CHANGELOG_TEXT"
          printf '%s\n' \
            '### Installation' \
            '1. Download `jellyfin-plugin-hue-release.zip`' \
            '2. Extract to your Jellyfin plugins directory:' \
            '   - **Linux**: `/var/lib/jellyfin/plugins/HueSync/`' \
            '   - **Windows**: `%ProgramData%\Jellyfin\Server\plugins\HueSync\`' \
            '   - **Docker**: `/config/plugins/HueSync/`' \
            '3. Restart Jellyfin' \
            '4. Configure the plugin in Dashboard → Plugins → Philips Hue Sync' \
            '' \
            '### Requirements' \
            '- Jellyfin 10.9.0+' \
            '- Philips Hue Bridge V2' \
            '- `ffmpeg` installed on server (the Hue DTLS transport is included in the package)' \
            '' \
            "### What's Included" \
            '- `Jellyfin.Plugin.Hue.dll` - Main plugin assembly' \
            '- `BouncyCastle.Cryptography.dll` - Managed DTLS transport dependency' \
            '- `meta.json` - Plugin metadata (required by Jellyfin)' \
            '- `jellyfin-plugin-hue-release.manifest.json` - Hash-locked package and dependency manifest' \
            '- `.sha256` sidecars - Integrity checks for the ZIP and manifest'
          } > "$body_file"

        command -v gh >/dev/null
        gh --version | head -n 1

        find_release_json() {
          # Search every release page so an older draft remains resumable after
          # the repository grows beyond the first 100 releases.
          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            | jq -sc --arg tag "$RELEASE_TAG" 'add | [.[] | select(.tag_name == $tag)] | first'
        }

        ensure_draft() {
          local release_json target_sha
          release_json="$(find_release_json)"
          if [ "$release_json" != "null" ]; then
            if ! jq -e '.draft == true' <<<"$release_json" >/dev/null; then
              echo "Release $RELEASE_TAG is already published; refusing to overwrite it." >&2
              return 1
            fi
            target_sha="$(jq -er '.target_commitish' <<<"$release_json")"
            if [ "$target_sha" != "$RELEASE_SHA" ]; then
              echo "Release $RELEASE_TAG already targets $target_sha, expected $RELEASE_SHA; refusing to publish." >&2
              return 1
            fi
            RELEASE_ID="$(jq -er '.id' <<<"$release_json")"
            echo "Release $RELEASE_TAG already exists at $RELEASE_SHA; resuming it."
            return 0
          fi

          gh release create "$RELEASE_TAG" \
            --draft \
            --verify-tag \
            --target "$RELEASE_SHA" \
            --title "Jellyfin Hue Sync v${RELEASE_VERSION}" \
            --notes-file "$body_file"

          release_json="$(retry find_release_json)"
          if [ "$release_json" = "null" ]; then
            echo "GitHub did not expose the draft release $RELEASE_TAG after creation." >&2
            return 1
          fi
          if ! jq -e '.draft == true' <<<"$release_json" >/dev/null; then
            echo "Release $RELEASE_TAG was not created as a draft." >&2
            return 1
          fi
          target_sha="$(jq -er '.target_commitish' <<<"$release_json")"
          if [ "$target_sha" != "$RELEASE_SHA" ]; then
            echo "Release $RELEASE_TAG was created at $target_sha, expected $RELEASE_SHA; refusing to publish." >&2
            return 1
          fi
          RELEASE_ID="$(jq -er '.id' <<<"$release_json")"
        }

        retry ensure_draft
        test -n "${RELEASE_ID:-}"

        retry gh release upload "$RELEASE_TAG" \
          jellyfin-plugin-hue-release.zip \
          jellyfin-plugin-hue-release.zip.sha256 \
          jellyfin-plugin-hue-release.manifest.json \
          jellyfin-plugin-hue-release.manifest.json.sha256 \
          --clobber

        # Verify GitHub's recorded asset digests, not only the asset names. This
        # keeps a successful publication bound to the exact locally verified ZIP,
        # checksums, and dependency manifest bytes.
        local_zip_digest="$(sha256sum jellyfin-plugin-hue-release.zip | awk '{ print $1 }')"
        local_checksum_digest="$(sha256sum jellyfin-plugin-hue-release.zip.sha256 | awk '{ print $1 }')"
        local_manifest_digest="$(sha256sum jellyfin-plugin-hue-release.manifest.json | awk '{ print $1 }')"
        local_manifest_checksum_digest="$(sha256sum jellyfin-plugin-hue-release.manifest.json.sha256 | awk '{ print $1 }')"
        expected_zip_digest="$(awk 'NR == 1 { print $1 }' jellyfin-plugin-hue-release.zip.sha256)"
        expected_manifest_digest="$(awk 'NR == 1 { print $1 }' jellyfin-plugin-hue-release.manifest.json.sha256)"
        test "$expected_zip_digest" = "$local_zip_digest"
        test "$expected_manifest_digest" = "$local_manifest_digest"
        printf '%s\n' "$local_zip_digest" | grep -Eq '^[0-9a-f]{64}$'
        printf '%s\n' "$local_checksum_digest" | grep -Eq '^[0-9a-f]{64}$'
        printf '%s\n' "$local_manifest_digest" | grep -Eq '^[0-9a-f]{64}$'
        printf '%s\n' "$local_manifest_checksum_digest" | grep -Eq '^[0-9a-f]{64}$'
        test -n "${GITHUB_REPOSITORY:-}"
        remote_release="$(retry gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}")"
        remote_zip_digest="$(jq -er --arg name jellyfin-plugin-hue-release.zip '
          [.assets[] | select((.name == $name) and (.state == "uploaded")) | .digest] as $digests
          | if ($digests | length) != 1 then error("release ZIP asset must have exactly one digest")
            elif ($digests[0] | type) != "string" then error("release ZIP asset digest is missing")
            elif ($digests[0] | test("^sha256:[0-9a-f]{64}$") | not) then error("release ZIP asset digest is malformed")
            else $digests[0]
            end
        ' <<<"$remote_release")"
        remote_checksum_digest="$(jq -er --arg name jellyfin-plugin-hue-release.zip.sha256 '
          [.assets[] | select((.name == $name) and (.state == "uploaded")) | .digest] as $digests
          | if ($digests | length) != 1 then error("release checksum asset must have exactly one digest")
            elif ($digests[0] | type) != "string" then error("release checksum asset digest is missing")
            elif ($digests[0] | test("^sha256:[0-9a-f]{64}$") | not) then error("release checksum asset digest is malformed")
            else $digests[0]
            end
        ' <<<"$remote_release")"
        remote_manifest_digest="$(jq -er --arg name jellyfin-plugin-hue-release.manifest.json '
          [.assets[] | select((.name == $name) and (.state == "uploaded")) | .digest] as $digests
          | if ($digests | length) != 1 then error("release manifest asset must have exactly one digest")
            elif ($digests[0] | type) != "string" then error("release manifest asset digest is missing")
            elif ($digests[0] | test("^sha256:[0-9a-f]{64}$") | not) then error("release manifest asset digest is malformed")
            else $digests[0]
            end
        ' <<<"$remote_release")"
        remote_manifest_checksum_digest="$(jq -er --arg name jellyfin-plugin-hue-release.manifest.json.sha256 '
          [.assets[] | select((.name == $name) and (.state == "uploaded")) | .digest] as $digests
          | if ($digests | length) != 1 then error("release manifest checksum asset must have exactly one digest")
            elif ($digests[0] | type) != "string" then error("release manifest checksum asset digest is missing")
            elif ($digests[0] | test("^sha256:[0-9a-f]{64}$") | not) then error("release manifest checksum asset digest is malformed")
            else $digests[0]
            end
        ' <<<"$remote_release")"
        test "$remote_zip_digest" = "sha256:${local_zip_digest}"
        test "$remote_checksum_digest" = "sha256:${local_checksum_digest}"
        test "$remote_manifest_digest" = "sha256:${local_manifest_digest}"
        test "$remote_manifest_checksum_digest" = "sha256:${local_manifest_checksum_digest}"
        echo "GitHub release asset digests match the locally verified ZIP, checksum, and manifest bytes."

        # Refuse to publish a draft that contains anything other than the
        # four verified release assets. This check intentionally runs before
        # the draft is made public, and is repeated after publication below.
        release_assets="$(retry gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}")"
        jq -e '([.assets[] | select(.state == "uploaded") | .name] | sort == ["jellyfin-plugin-hue-release.manifest.json", "jellyfin-plugin-hue-release.manifest.json.sha256", "jellyfin-plugin-hue-release.zip", "jellyfin-plugin-hue-release.zip.sha256"])' \
          <<<"$release_assets" >/dev/null

        retry gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
          -F draft=false \
          -F prerelease=false \
          -f "name=Jellyfin Hue Sync v${RELEASE_VERSION}" \
          -f "body=$(cat "$body_file")" >/dev/null

        final_release="$(retry gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}")"
        jq -e --arg tag "$RELEASE_TAG" --arg sha "$RELEASE_SHA" \
          --arg zip_digest "sha256:${local_zip_digest}" \
          --arg checksum_digest "sha256:${local_checksum_digest}" \
          --arg manifest_digest "sha256:${local_manifest_digest}" \
          --arg manifest_checksum_digest "sha256:${local_manifest_checksum_digest}" \
          '(.tag_name == $tag) and (.target_commitish == $sha) and (.draft == false) and (.prerelease == false) and ([.assets[].name] | sort == ["jellyfin-plugin-hue-release.manifest.json", "jellyfin-plugin-hue-release.manifest.json.sha256", "jellyfin-plugin-hue-release.zip", "jellyfin-plugin-hue-release.zip.sha256"]) and ([.assets[] | select((.name == "jellyfin-plugin-hue-release.zip") and (.state == "uploaded") and (.digest == $zip_digest))] | length == 1) and ([.assets[] | select((.name == "jellyfin-plugin-hue-release.zip.sha256") and (.state == "uploaded") and (.digest == $checksum_digest))] | length == 1) and ([.assets[] | select((.name == "jellyfin-plugin-hue-release.manifest.json") and (.state == "uploaded") and (.digest == $manifest_digest))] | length == 1) and ([.assets[] | select((.name == "jellyfin-plugin-hue-release.manifest.json.sha256") and (.state == "uploaded") and (.digest == $manifest_checksum_digest))] | length == 1)' \
          <<<"$final_release" >/dev/null
        echo "Published $RELEASE_TAG at $RELEASE_SHA with verified ZIP, checksum, and manifest asset digests."
