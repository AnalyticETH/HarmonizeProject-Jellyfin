name: .NET CI/CD

on:
  push:
    branches: [ main, master, develop, claude/** ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

env:
  DOTNET_VERSION: '8.0.x'
  BUILD_CONFIGURATION: 'Release'

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Shallow clones disabled for better analysis

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Cache NuGet packages
      uses: actions/cache@v5
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore dependencies
      run: dotnet restore

    - name: Build solution
      run: dotnet build --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore

    - name: Run tests
      run: dotnet test --configuration ${{ env.BUILD_CONFIGURATION }} --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx" --collect:"XPlat Code Coverage" --results-directory ./TestResults

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: ./TestResults/*.trx
        retention-days: 30

    - name: Upload code coverage artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: code-coverage
        path: ./TestResults/**/coverage.cobertura.xml
        retention-days: 30

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        files: ./TestResults/**/coverage.cobertura.xml
        flags: unittests
        name: jellyfin-hue-coverage
        fail_ci_if_error: false
        verbose: true
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    - name: Publish plugin
      run: dotnet publish Jellyfin.Plugin.Hue/Jellyfin.Plugin.Hue.csproj --configuration ${{ env.BUILD_CONFIGURATION }} --no-build --output ./publish

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: jellyfin-plugin-hue
        path: ./publish/
        retention-days: 90

    - name: Generate build summary
      if: always()
      run: |
        echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- **Configuration:** ${{ env.BUILD_CONFIGURATION }}" >> $GITHUB_STEP_SUMMARY
        echo "- **.NET Version:** ${{ env.DOTNET_VERSION }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        if [ -f "./TestResults/test-results.trx" ]; then
          echo "✅ Tests completed" >> $GITHUB_STEP_SUMMARY
        else
          echo "⚠️ No test results found" >> $GITHUB_STEP_SUMMARY
        fi

  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore

    - name: Run dotnet format check
      run: dotnet format --verify-no-changes --verbosity diagnostic || true

    - name: Security scan with .NET tools
      run: |
        dotnet list package --vulnerable --include-transitive 2>&1 | tee vulnerable-packages.txt || true

    - name: Upload security scan results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: security-scan
        path: vulnerable-packages.txt
        retention-days: 30

  create-release-package:
    name: Create Release Package
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore and build
      run: |
        dotnet restore
        dotnet build --configuration ${{ env.BUILD_CONFIGURATION }}

    - name: Create plugin package
      run: |
        mkdir -p release-package
        # Only include the DLL and meta.json (Jellyfin requirements)
        cp Jellyfin.Plugin.Hue/bin/Release/net8.0/Jellyfin.Plugin.Hue.dll release-package/
        cp meta.json release-package/

    - name: Create zip archive
      run: |
        cd release-package
        zip -r ../jellyfin-plugin-hue-release.zip .
        cd ..

    - name: Upload release package
      uses: actions/upload-artifact@v4
      with:
        name: release-package
        path: jellyfin-plugin-hue-release.zip
        retention-days: 90

    - name: Generate release notes
      run: |
        echo "# Jellyfin Plugin Hue - Release Package" > release-notes.md
        echo "" >> release-notes.md
        echo "## Build Information" >> release-notes.md
        echo "- **Commit:** ${{ github.sha }}" >> release-notes.md
        echo "- **Date:** $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> release-notes.md
        echo "- **Branch:** ${{ github.ref_name }}" >> release-notes.md
        echo "" >> release-notes.md
        echo "## Installation" >> release-notes.md
        echo "1. Download the release package" >> release-notes.md
        echo "2. Extract to your Jellyfin plugins directory" >> release-notes.md
        echo "3. Restart Jellyfin" >> release-notes.md

    - name: Upload release notes
      uses: actions/upload-artifact@v4
      with:
        name: release-notes
        path: release-notes.md
        retention-days: 90

  create-github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: create-release-package
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Extract version from meta.json
      id: version
      run: |
        VERSION=$(cat meta.json | grep -oP '"version":\s*"\K[^"]+')
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "tag=v$VERSION" >> $GITHUB_OUTPUT
        echo "Detected version: $VERSION"

    - name: Download release package
      uses: actions/download-artifact@v4
      with:
        name: release-package
        path: ./

    - name: Extract changelog for current version
      id: changelog
      run: |
        VERSION="${{ steps.version.outputs.version }}"
        if [ -f CHANGELOG.md ]; then
          # Extract changelog section for current version
          CHANGES=$(sed -n "/## \[${VERSION}\]/,/## \[/p" CHANGELOG.md | sed '$d' | tail -n +2)
          if [ -z "$CHANGES" ]; then
            CHANGES="See CHANGELOG.md for details."
          fi
        else
          CHANGES=$(cat meta.json | grep -oP '"changelog":\s*"\K[^"]+' | sed 's/\\n/\n/g')
        fi
        echo "changes<<EOF" >> $GITHUB_OUTPUT
        echo "$CHANGES" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.version.outputs.tag }}
        name: Jellyfin Hue Sync v${{ steps.version.outputs.version }}
        body: |
          ## Jellyfin Philips Hue Sync Plugin v${{ steps.version.outputs.version }}

          ### Changes
          ${{ steps.changelog.outputs.changes }}

          ### Installation
          1. Download `jellyfin-plugin-hue-release.zip`
          2. Extract to your Jellyfin plugins directory:
             - **Linux**: `/var/lib/jellyfin/plugins/HueSync/`
             - **Windows**: `%ProgramData%\Jellyfin\Server\plugins\HueSync\`
             - **Docker**: `/config/plugins/HueSync/`
          3. Restart Jellyfin
          4. Configure the plugin in Dashboard → Plugins → Philips Hue Sync

          ### Requirements
          - Jellyfin 10.9.0+
          - Philips Hue Bridge V2
          - `ffmpeg` and `openssl` installed on server

          ### What's Included
          - `Jellyfin.Plugin.Hue.dll` - Main plugin assembly
          - `meta.json` - Plugin metadata (required by Jellyfin)
        files: |
          jellyfin-plugin-hue-release.zip
        draft: false
        prerelease: false
        fail_on_unmatched_files: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
