name: .NET CI/CD

on:
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: jellyfin-hue-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_VERSION: '8.0.x'
  BUILD_CONFIGURATION: 'Release'
  # The self-hosted runner uses the dedicated, least-privileged
  # `harmonize-runner` service account.
  DOTNET_INSTALL_DIR: /var/lib/harmonize-runner/home/.dotnet

jobs:
  build-and-test:
    name: Build and Test
    if: github.ref == 'refs/heads/main'
    runs-on: ["self-hosted", "Linux", "X64", "harmonizeproject-jellyfin"]
    # Bound persistent-runner occupancy if a restore, test, or external tool stalls.
    timeout-minutes: 20

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0  # Shallow clones disabled for better analysis

    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Cache NuGet packages
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/packages.lock.json') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore dependencies
      run: dotnet restore --locked-mode

    - name: Build solution
      run: dotnet build --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore

    - name: Run tests
      run: dotnet test --configuration ${{ env.BUILD_CONFIGURATION }} --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx" --collect:"XPlat Code Coverage" --results-directory ./TestResults

    - name: Validate administrator configuration page
      run: node scripts/validate-config-page.mjs

    - name: Validate release documentation and package contract
      run: node scripts/validate-release-docs.mjs

    - name: Validate preview API documentation and route contract
      run: node scripts/validate-api-docs.mjs

    - name: Upload test results
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: test-results
        path: ./TestResults/*.trx
        retention-days: 30

    - name: Upload code coverage artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: code-coverage
        path: ./TestResults/**/coverage.cobertura.xml
        retention-days: 30

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f
      with:
        files: ./TestResults/**/coverage.cobertura.xml
        flags: unittests
        name: jellyfin-hue-coverage
        fail_ci_if_error: false
        verbose: true
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    - name: Publish plugin
      run: dotnet publish Jellyfin.Plugin.Hue/Jellyfin.Plugin.Hue.csproj --configuration ${{ env.BUILD_CONFIGURATION }} --no-build --output ./publish

    - name: Upload build artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: jellyfin-plugin-hue
        path: ./publish/
        retention-days: 90

    - name: Generate build summary
      if: always()
      env:
        BUILD_CONFIGURATION_VALUE: ${{ env.BUILD_CONFIGURATION }}
        DOTNET_VERSION_VALUE: ${{ env.DOTNET_VERSION }}
        COMMIT_SHA: ${{ github.sha }}
        BRANCH_NAME: ${{ github.ref_name }}
      run: |
        echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- **Configuration:** $BUILD_CONFIGURATION_VALUE" >> $GITHUB_STEP_SUMMARY
        echo "- **.NET Version:** $DOTNET_VERSION_VALUE" >> $GITHUB_STEP_SUMMARY
        echo "- **Commit:** $COMMIT_SHA" >> $GITHUB_STEP_SUMMARY
        echo "- **Branch:** $BRANCH_NAME" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        if [ -f "./TestResults/test-results.trx" ]; then
          echo "✅ Tests completed" >> $GITHUB_STEP_SUMMARY
        else
          echo "⚠️ No test results found" >> $GITHUB_STEP_SUMMARY
        fi

  code-quality:
    name: Code Quality Checks
    if: github.ref == 'refs/heads/main'
    runs-on: ["self-hosted", "Linux", "X64", "harmonizeproject-jellyfin"]
    needs: build-and-test
    timeout-minutes: 15

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore --locked-mode

    - name: Run dotnet format check
      run: dotnet format --verify-no-changes --no-restore --verbosity diagnostic

    - name: Security scan with .NET tools
      run: |
        set -o pipefail
        dotnet list package --vulnerable --include-transitive 2>&1 | tee vulnerable-packages.txt
        if grep -q "has the following vulnerable packages" vulnerable-packages.txt; then
          echo "Vulnerable packages detected; see vulnerable-packages.txt for details." >&2
          exit 1
        fi

    - name: Upload security scan results
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: security-scan
        path: vulnerable-packages.txt
        retention-days: 30

  security-analysis:
    name: Blocking Security Analysis
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/security-scan.yml
    permissions:
      contents: read

  create-release-package:
    name: Create Release Package
    runs-on: ["self-hosted", "Linux", "X64", "harmonizeproject-jellyfin"]
    needs: [build-and-test, code-quality, security-analysis]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 15

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore and build
      run: |
        dotnet restore --locked-mode
        dotnet build --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore

    - name: Create plugin package
      run: |
        mkdir -p release-package
        # Only include the DLL and meta.json (Jellyfin requirements)
        cp Jellyfin.Plugin.Hue/bin/Release/net8.0/Jellyfin.Plugin.Hue.dll release-package/
        cp meta.json release-package/
        META_VERSION=$(sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' meta.json | head -n 1)
        PROJECT_VERSION=$(sed -n 's/.*<Version>\([^<]*\)<\/Version>.*/\1/p' Jellyfin.Plugin.Hue/Jellyfin.Plugin.Hue.csproj | head -n 1)
        test -n "$META_VERSION" && test "$META_VERSION" = "$PROJECT_VERSION"
        test -f release-package/Jellyfin.Plugin.Hue.dll
        test -f release-package/meta.json

    - name: Create zip archive
      run: |
        cd release-package
        zip -q -r ../jellyfin-plugin-hue-release.zip .
        cd ..
        test "$(unzip -Z1 jellyfin-plugin-hue-release.zip | sort | tr '\n' ' ')" = "Jellyfin.Plugin.Hue.dll meta.json "
        sha256sum jellyfin-plugin-hue-release.zip > jellyfin-plugin-hue-release.zip.sha256

    - name: Upload release package
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: release-package
        path: |
          jellyfin-plugin-hue-release.zip
          jellyfin-plugin-hue-release.zip.sha256
        retention-days: 90

    - name: Generate release notes
      env:
        COMMIT_SHA: ${{ github.sha }}
        BRANCH_NAME: ${{ github.ref_name }}
      run: |
        echo "# Jellyfin Plugin Hue - Release Package" > release-notes.md
        echo "" >> release-notes.md
        echo "## Build Information" >> release-notes.md
        echo "- **Commit:** $COMMIT_SHA" >> release-notes.md
        echo "- **Date:** $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> release-notes.md
        echo "- **Branch:** $BRANCH_NAME" >> release-notes.md
        echo "" >> release-notes.md
        echo "## Installation" >> release-notes.md
        echo "1. Download the release package" >> release-notes.md
        echo "2. Extract to your Jellyfin plugins directory" >> release-notes.md
        echo "3. Restart Jellyfin" >> release-notes.md

    - name: Upload release notes
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: release-notes
        path: release-notes.md
        retention-days: 90

  create-github-release:
    name: Create GitHub Release
    # Keep the contents:write token off the persistent build/test identity.
    runs-on: ["self-hosted", "Linux", "X64", "harmonizeproject-jellyfin-release"]
    needs: create-release-package
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

    - name: Extract version from meta.json
      id: version
      run: |
        VERSION=$(cat meta.json | grep -oP '"version":\s*"\K[^"]+')
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "tag=v$VERSION" >> $GITHUB_OUTPUT
        echo "Detected version: $VERSION"

    - name: Download release package
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: release-package
        path: ./

    - name: Verify release package checksum
      run: |
        set -euo pipefail
        sha256sum --check --strict jellyfin-plugin-hue-release.zip.sha256

    - name: Extract changelog for current version
      id: changelog
      env:
        RELEASE_VERSION: ${{ steps.version.outputs.version }}
      run: |
        VERSION="$RELEASE_VERSION"
        if [ -f CHANGELOG.md ]; then
          # Metadata uses four-part assembly versions while the changelog uses SemVer.
          CHANGELOG_VERSION="$VERSION"
          if ! grep -q "## \[${CHANGELOG_VERSION}\]" CHANGELOG.md; then
            CHANGELOG_VERSION="${VERSION%.0}"
          fi
          CHANGES=$(sed -n "/## \[${CHANGELOG_VERSION}\]/,/## \[/p" CHANGELOG.md | sed '$d' | tail -n +2)
          if [ -z "$CHANGES" ]; then
            CHANGES="See CHANGELOG.md for details."
          fi
        else
          CHANGES=$(cat meta.json | grep -oP '"changelog":\s*"\K[^"]+' | sed 's/\\n/\n/g')
        fi
        echo "changes<<EOF" >> $GITHUB_OUTPUT
        echo "$CHANGES" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

    - name: Pin release tag to workflow commit
      env:
        RELEASE_TAG: ${{ steps.version.outputs.tag }}
        RELEASE_SHA: ${{ github.sha }}
      run: |
        set -euo pipefail
        TAG="$RELEASE_TAG"
        SHA="$RELEASE_SHA"
        set +e
        remote_tag_info="$(git ls-remote --refs origin "refs/tags/${TAG}" 2>&1)"
        lookup_status=$?
        set -e
        if [ "$lookup_status" -ne 0 ]; then
          echo "Could not verify release tag ${TAG}; refusing to publish." >&2
          echo "$remote_tag_info" >&2
          exit "$lookup_status"
        fi

        remote_tag_sha="$(printf '%s\n' "$remote_tag_info" | awk 'NR == 1 { print $1 }')"
        if [ -n "$remote_tag_sha" ]; then
          if [ "$remote_tag_sha" != "$SHA" ]; then
            echo "Release tag ${TAG} already points to ${remote_tag_sha}, expected workflow commit ${SHA}; refusing to publish." >&2
            exit 1
          fi

          echo "Release tag ${TAG} already points to workflow commit ${SHA}."
        else
          git tag --no-sign "$TAG" "$SHA"
          git push origin "refs/tags/${TAG}"
          created_tag_sha="$(git ls-remote --refs origin "refs/tags/${TAG}")"
          created_tag_sha="$(printf '%s\n' "$created_tag_sha" | awk 'NR == 1 { print $1 }')"
          test "$created_tag_sha" = "$SHA"
          echo "Created release tag ${TAG} at workflow commit ${SHA}."
        fi

    - name: Create GitHub Release
      uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
      with:
        tag_name: ${{ steps.version.outputs.tag }}
        target_commitish: ${{ github.sha }}
        name: Jellyfin Hue Sync v${{ steps.version.outputs.version }}
        body: |
          ## Jellyfin Philips Hue Sync Plugin v${{ steps.version.outputs.version }}

          ### Changes
          ${{ steps.changelog.outputs.changes }}

          ### Installation
          1. Download `jellyfin-plugin-hue-release.zip`
          2. Extract to your Jellyfin plugins directory:
             - **Linux**: `/var/lib/jellyfin/plugins/HueSync/`
             - **Windows**: `%ProgramData%\Jellyfin\Server\plugins\HueSync\`
             - **Docker**: `/config/plugins/HueSync/`
          3. Restart Jellyfin
          4. Configure the plugin in Dashboard → Plugins → Philips Hue Sync

          ### Requirements
          - Jellyfin 10.9.0+
          - Philips Hue Bridge V2
          - `ffmpeg` and `openssl` installed on server

          ### What's Included
          - `Jellyfin.Plugin.Hue.dll` - Main plugin assembly
          - `meta.json` - Plugin metadata (required by Jellyfin)
        files: |
          jellyfin-plugin-hue-release.zip
          jellyfin-plugin-hue-release.zip.sha256
        draft: false
        prerelease: false
        fail_on_unmatched_files: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
