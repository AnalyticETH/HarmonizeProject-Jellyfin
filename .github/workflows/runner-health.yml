name: Self-hosted Runner Health

# This is the one intentional GitHub-hosted job in the trusted operations set.
# It must keep running when the persistent self-hosted pool is offline; every
# workload, security, packaging, release, and Dependabot job remains bound to
# its documented self-hosted label.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: harmonizeproject-jellyfin-runner-health
  cancel-in-progress: true

jobs:
  runner-health:
    name: Runner health
    # Do not move this detector onto the pool it monitors: that would hide an
    # outage by leaving the health check queued with the workload jobs.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check self-hosted runners and queued runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          command -v gh >/dev/null
          command -v jq >/dev/null
          command -v date >/dev/null
          test -n "${GITHUB_REPOSITORY:-}"

          runner_json="$RUNNER_TEMP/harmonize-runner-health-runners.json"
          queued_json="$RUNNER_TEMP/harmonize-runner-health-queued.json"
          gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runners?per_page=100" \
            > "$runner_json"
          gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs?status=queued&per_page=100" \
            > "$queued_json"

          # A truncated or malformed API response is a failed health check, not
          # an opportunity to report a false-green result.
          jq -e '
            type == "object" and
            (.total_count | type == "number") and
            (.runners | type == "array") and
            (.total_count == (.runners | length)) and
            all(.runners[]?;
              (.name | type == "string") and
              (.status | type == "string") and
              (.labels | type == "array") and
              all(.labels[]?; (.name | type == "string")))
          ' "$runner_json" >/dev/null
          jq -e '
            type == "object" and
            (.total_count | type == "number") and
            (.workflow_runs | type == "array") and
            (.total_count == (.workflow_runs | length)) and
            all(.workflow_runs[]?;
              (.id | type == "number") and
              (.name | type == "string") and
              (.created_at | type == "string") and
              (.head_sha | type == "string")
            )
          ' "$queued_json" >/dev/null

          expected_runners='[
            {
              "name": "harmonizeproject-jellyfin",
              "labels": ["self-hosted", "Linux", "X64", "harmonizeproject-jellyfin"]
            },
            {
              "name": "harmonizeproject-jellyfin-runtime",
              "labels": ["self-hosted", "Linux", "X64", "harmonizeproject-jellyfin-runtime"]
            },
            {
              "name": "harmonizeproject-jellyfin-release",
              "labels": ["self-hosted", "Linux", "X64", "harmonizeproject-jellyfin-release"]
            },
            {
              "name": "harmonizeproject-jellyfin-dependabot",
              "labels": ["self-hosted", "Linux", "X64", "dependabot"]
            }
          ]'

          runner_health_ok=true
          if ! jq -e --argjson expected "$expected_runners" '
            . as $root |
            all($expected[];
              . as $want |
              any($root.runners[]?;
                .name == $want.name and
                .status == "online" and
                (($want.labels - ([.labels[]?.name])) | length == 0)
              )
            )
          ' "$runner_json" >/dev/null; then
            runner_health_ok=false
            echo "One or more expected self-hosted runners is missing, offline, or missing a required label." >&2
          fi

          now_epoch="$(date -u +%s)"
          stale_cutoff=$((now_epoch - 3600))
          stale_count="$(jq --argjson cutoff "$stale_cutoff" '
            [.workflow_runs[]
              | (.created_at | fromdateiso8601) as $created
              | select($created < $cutoff)]
            | length
          ' "$queued_json")"
          if [ "$stale_count" -ne 0 ]; then
            runner_health_ok=false
            echo "Found $stale_count queued workflow run(s) older than one hour." >&2
          fi

          {
            echo "### Self-hosted runner health"
            echo
            echo "Checked at $(date -u +%Y-%m-%dT%H:%M:%SZ)."
            echo
            echo "| Runner | Status | Labels |"
            echo "| --- | --- | --- |"
            jq -r --argjson expected "$expected_runners" '
              . as $root |
              $expected[] as $want |
              (first($root.runners[]? | select(.name == $want.name)) // {}) as $actual |
              ([$actual.labels[]?.name] | join(", ")) as $labels |
              [$want.name, ($actual.status // "missing"), (if $labels == "" then "none" else $labels end)] |
              "| `\(.[0])` | \(.[1]) | \(.[2]) |"
            ' "$runner_json"
            echo
            echo "Queued workflow runs: $(jq -r '.total_count' "$queued_json")."
            echo "Queued runs older than one hour: $stale_count."
            if [ "$stale_count" -gt 0 ]; then
              echo
              echo "Stale queued runs:"
              jq -r --argjson cutoff "$stale_cutoff" '
                .workflow_runs[]
                | (.created_at | fromdateiso8601) as $created
                | select($created < $cutoff)
                | "- run \(.id), workflow=\(.name), created=\(.created_at), head=\(.head_sha)"
              ' "$queued_json"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$runner_health_ok" != true ]; then
            echo "Self-hosted runner health failed; inspect the step summary and runner API response." >&2
            exit 1
          fi
          echo "Self-hosted runner health passed: all expected runners are online with required labels; no queued run is older than one hour."
