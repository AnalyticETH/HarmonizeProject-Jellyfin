name: Hosted Runner Health

# Keep a small scheduled probe for the GitHub-hosted environment used by every
# workflow. It checks the tools that the build, scanner, and runtime jobs rely on;
# it does not inspect or mutate repository settings.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: harmonizeproject-jellyfin-hosted-runner-health
  cancel-in-progress: true

env:
  DOTNET_VERSION: '8.0.424'

jobs:
  runner-health:
    name: GitHub-hosted toolchain health
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Verify hosted toolchain
        run: |
          set -euo pipefail
          node --version
          python3 --version
          jq --version
          docker --version
          docker info --format '{{.ServerVersion}}'
          dotnet --version
          node scripts/validate-dotnet-sdk.mjs
          node scripts/validate-workflow-inventory.mjs
          echo "GitHub-hosted runner health passed for ubuntu-24.04."
