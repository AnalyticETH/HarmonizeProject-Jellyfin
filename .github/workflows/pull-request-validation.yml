name: Pull Request Validation

# PR code is untrusted. Keep this workflow on an ephemeral GitHub-hosted runner
# with no secrets or write permissions. Semgrep
# scans all tracked production source/configuration with p/default and repository
# scripts with p/javascript/p/python, plus embedded administrator-page JavaScript;
# every report blocks findings, scanner errors, and timeouts. Reviewed Semgrep
# registry snapshots are committed under .github/semgrep/rules so mutable
# registry aliases cannot change policy during a run.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: jellyfin-hue-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: '8.0.424'
  BUILD_CONFIGURATION: 'Release'
  GITLEAKS_VERSION: '8.30.1'
  GITLEAKS_CHECKSUMS_SHA256: '061476c21adaf5441516f96f185c1a4706a83cd6329b9b38762271b3d4a52fae'
  SEMGREP_VERSION: '1.175.0'
  # These URLs document the official Semgrep registry sources for the reviewed,
  # SHA-256-pinned snapshots committed under .github/semgrep/rules. A changed
  # snapshot is reviewed and refreshed intentionally instead of changing policy
  # during a run.
  SEMGREP_DEFAULT_CONFIG_URL: 'https://semgrep.dev/c/p/default'
  SEMGREP_DEFAULT_CONFIG_PATH: '.github/semgrep/rules/default.yml'
  SEMGREP_DEFAULT_CONFIG_SHA256: 'db260499bbf619dae4dbf75d6754a39e4790d443b2c5d9a098c318d7036dd998'
  SEMGREP_JAVASCRIPT_CONFIG_URL: 'https://semgrep.dev/c/p/javascript'
  SEMGREP_JAVASCRIPT_CONFIG_PATH: '.github/semgrep/rules/javascript.yml'
  SEMGREP_JAVASCRIPT_CONFIG_SHA256: 'e65e8449157ef5d587f2c2a0c17ed388910ca90336e514d27941ccd25543cf4e'
  SEMGREP_PYTHON_CONFIG_URL: 'https://semgrep.dev/c/p/python'
  SEMGREP_PYTHON_CONFIG_PATH: '.github/semgrep/rules/python.yml'
  SEMGREP_PYTHON_CONFIG_SHA256: '31c1dfa46e8ddd97f9ac98c607ddd77b20a2c3356d7ec987359961d47ec27035'

jobs:
  build-test-and-contracts:
    name: Build, test, format, and contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout PR merge ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate pinned .NET SDK parity
        run: node scripts/validate-dotnet-sdk.mjs

      - name: Validate open-source production release contract
        run: node scripts/validate-open-source-release.mjs

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore --locked-mode

      - name: Build solution
        run: dotnet build --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore

      - name: Run tests
        run: dotnet test --configuration ${{ env.BUILD_CONFIGURATION }} --no-build --verbosity normal

      - name: Run dotnet format check
        run: dotnet format --verify-no-changes --no-restore --verbosity diagnostic

      - name: Validate administrator configuration page
        run: node scripts/validate-config-page.mjs

      - name: Test configuration export lifecycles
        run: node scripts/test-config-page-exports.mjs

      - name: Validate release documentation and package contract
        run: node scripts/validate-release-docs.mjs

      - name: Validate Dependabot coverage contract
        run: node scripts/validate-dependabot.mjs

      - name: Validate pull-request workflow boundary
        run: node scripts/validate-pull-request-workflow.mjs

      - name: Validate workflow inventory and runner boundaries
        run: node scripts/validate-workflow-inventory.mjs

      - name: Validate trusted workflow boundary
        run: node scripts/validate-trusted-workflow.mjs

      - name: Test workflow security contracts
        run: node scripts/test-workflow-contracts.mjs

      - name: Validate deterministic release package
        run: node scripts/validate-release-package.mjs

      - name: Validate preview API documentation and route contract
        run: node scripts/validate-api-docs.mjs

      - name: Check NuGet vulnerabilities
        run: |
          set -euo pipefail
          dotnet list Jellyfin.Plugin.Hue.sln package \
            --vulnerable \
            --include-transitive \
            --format json \
            --output-version 1 > vulnerable-packages.json
          test -s vulnerable-packages.json
          jq -e 'type == "object" and .version == 1 and (.projects | type == "array" and length > 0)' \
            vulnerable-packages.json >/dev/null
          vulnerable_count=$(jq '[.projects[]?.frameworks[]? | (.topLevelPackages[]?, .transitivePackages[]?) | select((.vulnerabilities // []) | length > 0)] | length' vulnerable-packages.json)
          echo "NuGet vulnerable package entries: $vulnerable_count"
          if [ "$vulnerable_count" -ne 0 ]; then
            echo "Vulnerable packages detected; refusing PR validation." >&2
            exit 1
          fi

  security-analysis:
    name: Secret and static security scans
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SEMGREP_SEND_METRICS: 'off'

    steps:
      - name: Checkout PR merge ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate Gitleaks policy
        run: node scripts/validate-gitleaks-config.mjs

      - name: Install gitleaks
        run: |
          set -euo pipefail
          archive_name="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          checksums_name="gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          archive_path="$RUNNER_TEMP/$archive_name"
          checksums_path="$RUNNER_TEMP/$checksums_name"
          release_url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"

          curl -sSfL --retry 3 --retry-all-errors \
            -o "$archive_path" "$release_url/$archive_name"
          curl -sSfL --retry 3 --retry-all-errors \
            -o "$checksums_path" "$release_url/$checksums_name"

          printf '%s  %s\n' "$GITLEAKS_CHECKSUMS_SHA256" "$checksums_path" \
            | sha256sum --check --strict -
          checksum_entry=$(awk -v name="$archive_name" '$2 == name { print $1 "  " $2 }' "$checksums_path")
          test -n "$checksum_entry"
          printf '%s\n' "$checksum_entry" \
            | (cd "$RUNNER_TEMP" && sha256sum --check --strict -)

          tar -xzf "$archive_path" -C "$RUNNER_TEMP" gitleaks
          chmod 0755 "$RUNNER_TEMP/gitleaks"
          test "$("$RUNNER_TEMP/gitleaks" version)" = "$GITLEAKS_VERSION"

      - name: Scan git history with gitleaks
        run: |
          set -euo pipefail
          set +e
          "$RUNNER_TEMP/gitleaks" detect --source . --redact --exit-code 1 \
            --config .gitleaks.toml \
            --report-format json --report-path "$RUNNER_TEMP/gitleaks.json"
          scan_status=$?
          set -e
          test -f "$RUNNER_TEMP/gitleaks.json"
          count=$(jq 'length' "$RUNNER_TEMP/gitleaks.json")
          echo "Gitleaks findings: $count"
          if [ "$scan_status" -ne 0 ]; then
            echo "Gitleaks failed or found potential secrets." >&2
            exit "$scan_status"
          fi

      - name: Validate Semgrep lock
        run: |
          set -euo pipefail
          grep -Fx "semgrep==$SEMGREP_VERSION" .github/semgrep/requirements.in
          node scripts/validate-semgrep-lock.mjs .github/semgrep/requirements.txt "$SEMGREP_VERSION"

      - name: Install Semgrep from hash-locked requirements
        id: install-semgrep
        run: |
          set -euo pipefail
          # Keep every run's generated snapshots, extracted page, and scanner
          # environment isolated. A canceled attempt can finish cleanup after
          # the next attempt starts, so shared RUNNER_TEMP paths are unsafe.
          semgrep_work_dir="$RUNNER_TEMP/semgrep-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$semgrep_work_dir"
          chmod 0700 "$semgrep_work_dir"
          semgrep_venv="$semgrep_work_dir/venv"
          SEMGREP_BIN="$semgrep_venv/bin/semgrep"
          echo "SEMGREP_WORK_DIR=$semgrep_work_dir" >> "$GITHUB_ENV"
          echo "SEMGREP_BIN=$SEMGREP_BIN" >> "$GITHUB_ENV"
          python3 -c 'import sys; sys.exit("Semgrep lock requires Python 3.12") if sys.version_info[:2] != (3, 12) else None'
          python3 -m venv "$semgrep_venv"
          "$semgrep_venv/bin/python" -m pip install \
            --disable-pip-version-check \
            --no-cache-dir \
            --only-binary=:all: \
            --require-hashes \
            --index-url https://pypi.org/simple \
            --requirement .github/semgrep/requirements.txt
          "$semgrep_venv/bin/python" -m pip check
          # The launcher reports its bundled core version, which can lag the
          # installed package pin; validate the package metadata instead.
          semgrep_package_version="$("$semgrep_venv/bin/python" -c 'import importlib.metadata as metadata; print(metadata.version("semgrep"))')"
          test "$semgrep_package_version" = "$SEMGREP_VERSION"
          default_source_path="$GITHUB_WORKSPACE/$SEMGREP_DEFAULT_CONFIG_PATH"
          javascript_source_path="$GITHUB_WORKSPACE/$SEMGREP_JAVASCRIPT_CONFIG_PATH"
          python_source_path="$GITHUB_WORKSPACE/$SEMGREP_PYTHON_CONFIG_PATH"
          default_config_path="$semgrep_work_dir/semgrep-default.yml"
          javascript_config_path="$semgrep_work_dir/semgrep-javascript.yml"
          python_config_path="$semgrep_work_dir/semgrep-python.yml"
          test -s "$default_source_path"
          test -s "$javascript_source_path"
          test -s "$python_source_path"
          printf '%s  %s\n' "$SEMGREP_DEFAULT_CONFIG_SHA256" "$default_source_path" \
            | sha256sum --check --strict -
          printf '%s  %s\n' "$SEMGREP_JAVASCRIPT_CONFIG_SHA256" "$javascript_source_path" \
            | sha256sum --check --strict -
          printf '%s  %s\n' "$SEMGREP_PYTHON_CONFIG_SHA256" "$python_source_path" \
            | sha256sum --check --strict -
          cp -- "$default_source_path" "$default_config_path"
          cp -- "$javascript_source_path" "$javascript_config_path"
          cp -- "$python_source_path" "$python_config_path"
          "$SEMGREP_BIN" validate "$default_config_path" >/dev/null
          "$SEMGREP_BIN" validate "$javascript_config_path" >/dev/null
          "$SEMGREP_BIN" validate "$python_config_path" >/dev/null
          node scripts/extract-inline-javascript.mjs \
            Jellyfin.Plugin.Hue/Configuration/configPage.html \
            "$semgrep_work_dir/config-page-inline.js"

      - name: Scan production source and repository configuration with Semgrep
        run: |
          set -euo pipefail
          set +e
          # Production C# taint analysis can hit a transient fixpoint timeout
          # on the hosted runner; keep the gate fail-closed while allowing a
          # bounded five-minute per-file analysis window. Serial execution keeps
          # taint fixpoint analysis stable on the hosted runner.
          "$SEMGREP_BIN" scan \
            --config "$SEMGREP_WORK_DIR/semgrep-default.yml" --metrics off --jobs 1 --timeout 300 \
            --include='*.cs' --include='*.yml' --include='*.yaml' \
            --include='*.json' --include='*.ps1' --include='*.sh' \
            --exclude .github/semgrep/rules \
            --json --output "$SEMGREP_WORK_DIR/semgrep-production.json" .
          scan_status=$?
          set -e
          test -f "$SEMGREP_WORK_DIR/semgrep-production.json"
          COUNT=$(jq '.results | length' "$SEMGREP_WORK_DIR/semgrep-production.json")
          ERRORS=$(jq '.errors | length' "$SEMGREP_WORK_DIR/semgrep-production.json")
          TIMEOUTS=$(jq '(.time.fixpoint_timeouts // []) | length' "$SEMGREP_WORK_DIR/semgrep-production.json")
          {
            echo "### Static analysis (semgrep: production source/configuration)"
            echo "Findings: **$COUNT** (blocking)"
            echo "Scanner errors: **$ERRORS** (blocking)"
            echo "Analysis timeouts: **$TIMEOUTS** (blocking)"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Semgrep production-source findings: $COUNT; scanner errors: $ERRORS; analysis timeouts: $TIMEOUTS"
          if [ "$scan_status" -ne 0 ]; then
            echo "Semgrep production-source scan failed." >&2
            exit "$scan_status"
          fi
          if [ "$COUNT" -gt 0 ] || [ "$ERRORS" -gt 0 ] || [ "$TIMEOUTS" -gt 0 ]; then
            echo "Semgrep production-source scan found security findings, scanner errors, or analysis timeouts." >&2
            exit 1
          fi

      - name: Scan repository scripts with Semgrep JavaScript rules
        if: always() && steps.install-semgrep.outcome == 'success'
        run: |
          set -euo pipefail
          script_rule_prefix="${SEMGREP_WORK_DIR#/}"
          script_rule_prefix="${script_rule_prefix//\//.}"
          script_rule_excludes=()
          while IFS= read -r rule; do
            case "$rule" in
              ""|\#*) continue ;;
            esac
            script_rule_excludes+=(--exclude-rule="${script_rule_prefix}.${rule}")
          done < .github/semgrep/script-excludes.txt
          test "${#script_rule_excludes[@]}" -eq 1
          set +e
          "$SEMGREP_BIN" scan \
            --config "$SEMGREP_WORK_DIR/semgrep-javascript.yml" --metrics off --timeout 120 \
            --include='*.mjs' \
            "${script_rule_excludes[@]}" \
            --json --output "$SEMGREP_WORK_DIR/semgrep-scripts.json" scripts
          scan_status=$?
          set -e
          test -f "$SEMGREP_WORK_DIR/semgrep-scripts.json"
          COUNT=$(jq '.results | length' "$SEMGREP_WORK_DIR/semgrep-scripts.json")
          ERRORS=$(jq '.errors | length' "$SEMGREP_WORK_DIR/semgrep-scripts.json")
          TIMEOUTS=$(jq '(.time.fixpoint_timeouts // []) | length' "$SEMGREP_WORK_DIR/semgrep-scripts.json")
          {
            echo "### Static analysis (semgrep: repository scripts)"
            echo "Findings: **$COUNT** (blocking)"
            echo "Scanner errors: **$ERRORS** (blocking)"
            echo "Analysis timeouts: **$TIMEOUTS** (blocking)"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Semgrep script findings: $COUNT; scanner errors: $ERRORS; analysis timeouts: $TIMEOUTS"
          if [ "$scan_status" -ne 0 ]; then
            echo "Semgrep repository-scripts scan failed." >&2
            exit "$scan_status"
          fi
          if [ "$COUNT" -gt 0 ] || [ "$ERRORS" -gt 0 ] || [ "$TIMEOUTS" -gt 0 ]; then
            echo "Semgrep repository-scripts scan found security findings, scanner errors, or analysis timeouts." >&2
            exit 1
          fi
      - name: Scan repository Python scripts with Semgrep Python rules
        if: always() && steps.install-semgrep.outcome == 'success'
        run: |
          set -euo pipefail
          set +e
          "$SEMGREP_BIN" scan \
            --config "$SEMGREP_WORK_DIR/semgrep-python.yml" --metrics off --timeout 120 \
            --include='*.py' \
            --json --output "$SEMGREP_WORK_DIR/semgrep-python.json" scripts
          scan_status=$?
          set -e
          test -f "$SEMGREP_WORK_DIR/semgrep-python.json"
          COUNT=$(jq '.results | length' "$SEMGREP_WORK_DIR/semgrep-python.json")
          ERRORS=$(jq '.errors | length' "$SEMGREP_WORK_DIR/semgrep-python.json")
          TIMEOUTS=$(jq '(.time.fixpoint_timeouts // []) | length' "$SEMGREP_WORK_DIR/semgrep-python.json")
          {
            echo "### Static analysis (semgrep: repository Python scripts)"
            echo "Findings: **$COUNT** (blocking)"
            echo "Scanner errors: **$ERRORS** (blocking)"
            echo "Analysis timeouts: **$TIMEOUTS** (blocking)"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Semgrep Python-script findings: $COUNT; scanner errors: $ERRORS; analysis timeouts: $TIMEOUTS"
          if [ "$scan_status" -ne 0 ]; then
            echo "Semgrep repository-Python scan failed." >&2
            exit "$scan_status"
          fi
          if [ "$COUNT" -gt 0 ] || [ "$ERRORS" -gt 0 ] || [ "$TIMEOUTS" -gt 0 ]; then
            echo "Semgrep repository-Python scan found security findings, scanner errors, or analysis timeouts." >&2
            exit 1
          fi
      - name: Scan embedded administrator JavaScript with Semgrep JavaScript rules
        if: always() && steps.install-semgrep.outcome == 'success'
        run: |
          set -euo pipefail
          config_rule_prefix="${SEMGREP_WORK_DIR#/}"
          config_rule_prefix="${config_rule_prefix//\//.}"
          config_page_rule_excludes=()
          while IFS= read -r rule; do
            case "$rule" in
              ""|\#*) continue ;;
            esac
            config_page_rule_excludes+=(--exclude-rule="${config_rule_prefix}.${rule}")
          done < .github/semgrep/config-page-excludes.txt
          test "${#config_page_rule_excludes[@]}" -eq 36
          set +e
          "$SEMGREP_BIN" scan \
            --config "$SEMGREP_WORK_DIR/semgrep-javascript.yml" --metrics off --timeout 120 --max-target-bytes=2MB \
            --include='*.js' \
            "${config_page_rule_excludes[@]}" \
            --json --output "$SEMGREP_WORK_DIR/semgrep-config-page.json" "$SEMGREP_WORK_DIR/config-page-inline.js"
          scan_status=$?
          set -e
          test -f "$SEMGREP_WORK_DIR/semgrep-config-page.json"
          COUNT=$(jq '.results | length' "$SEMGREP_WORK_DIR/semgrep-config-page.json")
          ERRORS=$(jq '.errors | length' "$SEMGREP_WORK_DIR/semgrep-config-page.json")
          TIMEOUTS=$(jq '(.time.fixpoint_timeouts // []) | length' "$SEMGREP_WORK_DIR/semgrep-config-page.json")
          TARGET_SCANNED=$(jq --arg target "$SEMGREP_WORK_DIR/config-page-inline.js" \
            'any((.paths.scanned // [])[]; . == $target)' "$SEMGREP_WORK_DIR/semgrep-config-page.json")
          {
            echo "### Static analysis (semgrep: embedded administrator JavaScript)"
            echo "Findings: **$COUNT** (blocking)"
            echo "Scanner errors: **$ERRORS** (blocking)"
            echo "Analysis timeouts: **$TIMEOUTS** (blocking)"
            echo "Extracted target scanned: **$TARGET_SCANNED** (blocking)"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Semgrep embedded administrator JavaScript findings: $COUNT; scanner errors: $ERRORS; analysis timeouts: $TIMEOUTS; extracted target scanned: $TARGET_SCANNED"
          if [ "$scan_status" -ne 0 ]; then
            echo "Semgrep embedded administrator JavaScript scan failed." >&2
            exit "$scan_status"
          fi
          if [ "$TARGET_SCANNED" != "true" ]; then
            echo "Semgrep embedded administrator JavaScript scan did not scan the extracted target; refusing a false-clean result." >&2
            exit 1
          fi
          if [ "$COUNT" -gt 0 ] || [ "$ERRORS" -gt 0 ] || [ "$TIMEOUTS" -gt 0 ]; then
            echo "Semgrep embedded administrator JavaScript scan found security findings, scanner errors, or analysis timeouts." >&2
            exit 1
          fi
