name: Security Scan

# Blocking OSS secret + code scanning for every push and pull request.
# gitleaks (secrets) + semgrep (SAST) publish redacted JSON artifacts and fail
# the job on findings or scanner errors. Dependency scanning stays with the
# free Dependabot alerts and the .NET vulnerability check in dotnet-ci.yml.

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-scan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ["self-hosted", "Linux", "X64", "harmonizeproject-jellyfin"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Install gitleaks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(curl -sSfL -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/gitleaks/gitleaks/releases/latest | jq -r .tag_name)
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/${TAG}/gitleaks_${TAG#v}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo install gitleaks /usr/local/bin/
      - name: Scan git history
        run: |
          set -euo pipefail
          set +e
          gitleaks detect --source . --redact --exit-code 1 \
            --report-format json --report-path gitleaks.json
          scan_status=$?
          set -e
          test -f gitleaks.json || {
            echo "gitleaks did not produce a report" >&2
            exit 1
          }
          COUNT=$(jq 'length' gitleaks.json)
          { echo "### Secret scan (gitleaks)"; echo "Leaks found: **$COUNT** (blocking)"; } >> "$GITHUB_STEP_SUMMARY"
          if [ "$scan_status" -ne 0 ]; then
            echo "gitleaks failed or found potential secrets; see the gitleaks-report artifact" >&2
            exit "$scan_status"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: gitleaks-report
          path: gitleaks.json
          if-no-files-found: ignore

  semgrep:
    name: Static analysis (semgrep)
    runs-on: ["self-hosted", "Linux", "X64", "harmonizeproject-jellyfin"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install semgrep
        run: |
          python3 -m venv "$RUNNER_TEMP/semgrep-venv"
          "$RUNNER_TEMP/semgrep-venv/bin/python" -m pip install --disable-pip-version-check semgrep
      - name: Scan (OSS rules)
        env:
          SEMGREP_SEND_METRICS: 'off'
        run: |
          set -euo pipefail
          set +e
          "$RUNNER_TEMP/semgrep-venv/bin/semgrep" scan \
            --config p/default --metrics off --timeout 30 --json --output semgrep.json .
          scan_status=$?
          set -e
          test -f semgrep.json || {
            echo "Semgrep did not produce a report" >&2
            exit 1
          }
          COUNT=$(jq '.results | length' semgrep.json)
          ERRORS=$(jq '.errors | length' semgrep.json)
          {
            echo "### Static analysis (semgrep)"
            echo "Findings: **$COUNT** (blocking)"
            echo "Scanner errors: **$ERRORS** (blocking)"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$scan_status" -ne 0 ]; then
            echo "Semgrep failed; see the semgrep-report artifact" >&2
            exit "$scan_status"
          fi
          if [ "$COUNT" -gt 0 ] || [ "$ERRORS" -gt 0 ]; then
            echo "Semgrep found security findings or scanner errors; see the semgrep-report artifact" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: semgrep-report
          path: semgrep.json
          if-no-files-found: ignore
