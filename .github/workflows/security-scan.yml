name: Security Scan

# Reusable blocking OSS secret + code scanning. The .NET CI/CD workflow calls
# this gate for every trusted main push; weekly default-branch runs remain here.
# gitleaks (secrets) + semgrep (SAST) publish redacted JSON artifacts and fail
# the job on findings or scanner errors. Dependency scanning stays with the
# free Dependabot alerts and the .NET vulnerability check in dotnet-ci.yml.

on:
  workflow_call:
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

env:
  GITLEAKS_VERSION: '8.30.1'
  GITLEAKS_CHECKSUMS_SHA256: '061476c21adaf5441516f96f185c1a4706a83cd6329b9b38762271b3d4a52fae'
  SEMGREP_VERSION: '1.174.0'

concurrency:
  group: security-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Secret scan (gitleaks)
    if: github.ref == 'refs/heads/main'
    runs-on: ["self-hosted", "Linux", "X64", "harmonizeproject-jellyfin"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          set -euo pipefail
          archive_name="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          checksums_name="gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          archive_path="$RUNNER_TEMP/$archive_name"
          checksums_path="$RUNNER_TEMP/$checksums_name"
          release_url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"

          curl -sSfL --retry 3 --retry-all-errors \
            -o "$archive_path" "$release_url/$archive_name"
          curl -sSfL --retry 3 --retry-all-errors \
            -o "$checksums_path" "$release_url/$checksums_name"

          printf '%s  %s\n' "$GITLEAKS_CHECKSUMS_SHA256" "$checksums_path" \
            | sha256sum --check --strict -
          checksum_entry=$(awk -v name="$archive_name" '$2 == name { print $1 "  " $2 }' "$checksums_path")
          test -n "$checksum_entry"
          printf '%s\n' "$checksum_entry" \
            | (cd "$RUNNER_TEMP" && sha256sum --check --strict -)

          tar -xzf "$archive_path" -C "$RUNNER_TEMP" gitleaks
          chmod 0755 "$RUNNER_TEMP/gitleaks"
          test "$("$RUNNER_TEMP/gitleaks" version)" = "$GITLEAKS_VERSION"
      - name: Scan git history
        run: |
          set -euo pipefail
          set +e
          "$RUNNER_TEMP/gitleaks" detect --source . --redact --exit-code 1 \
            --report-format json --report-path gitleaks.json
          scan_status=$?
          set -e
          test -f gitleaks.json || {
            echo "gitleaks did not produce a report" >&2
            exit 1
          }
          COUNT=$(jq 'length' gitleaks.json)
          { echo "### Secret scan (gitleaks)"; echo "Leaks found: **$COUNT** (blocking)"; } >> "$GITHUB_STEP_SUMMARY"
          if [ "$scan_status" -ne 0 ]; then
            echo "gitleaks failed or found potential secrets; see the gitleaks-report artifact" >&2
            exit "$scan_status"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: gitleaks-report
          path: gitleaks.json
          if-no-files-found: ignore

  semgrep:
    name: Static analysis (semgrep)
    if: github.ref == 'refs/heads/main'
    runs-on: ["self-hosted", "Linux", "X64", "harmonizeproject-jellyfin"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install semgrep
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/semgrep-venv"
          "$RUNNER_TEMP/semgrep-venv/bin/python" -m pip install --disable-pip-version-check \
            "semgrep==$SEMGREP_VERSION"
          test "$("$RUNNER_TEMP/semgrep-venv/bin/semgrep" --version)" = "$SEMGREP_VERSION"
      - name: Scan (OSS rules)
        env:
          SEMGREP_SEND_METRICS: 'off'
        run: |
          set -euo pipefail
          set +e
          "$RUNNER_TEMP/semgrep-venv/bin/semgrep" scan \
            --config p/default --metrics off --timeout 120 --json --output semgrep.json .
          scan_status=$?
          set -e
          test -f semgrep.json || {
            echo "Semgrep did not produce a report" >&2
            exit 1
          }
          COUNT=$(jq '.results | length' semgrep.json)
          ERRORS=$(jq '.errors | length' semgrep.json)
          {
            echo "### Static analysis (semgrep)"
            echo "Findings: **$COUNT** (blocking)"
            echo "Scanner errors: **$ERRORS** (blocking)"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$scan_status" -ne 0 ]; then
            echo "Semgrep failed; see the semgrep-report artifact" >&2
            exit "$scan_status"
          fi
          if [ "$COUNT" -gt 0 ] || [ "$ERRORS" -gt 0 ]; then
            echo "Semgrep found security findings or scanner errors; see the semgrep-report artifact" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: semgrep-report
          path: semgrep.json
          if-no-files-found: ignore
