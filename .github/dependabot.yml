# Dependabot configuration for automated dependency updates
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates

version: 2
updates:
  # NuGet packages for .NET projects
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps"
      include: "scope"
    labels:
      - "dependencies"
      - "nuget"
    reviewers:
      - "AnalyticETH"
    groups:
      # Group Jellyfin SDK packages together
      jellyfin-sdk:
        patterns:
          - "Jellyfin.*"
        update-types:
          - "minor"
          - "patch"
      # Group test framework packages
      testing:
        patterns:
          - "xunit*"
          - "Moq"
          - "coverlet.*"
          - "Microsoft.NET.Test.Sdk"
        update-types:
          - "minor"
          - "patch"
      # Group System.* security updates
      system-packages:
        patterns:
          - "System.*"
        update-types:
          - "patch"
    ignore:
      # Ignore major version bumps for Jellyfin (may break compatibility)
      - dependency-name: "Jellyfin.*"
        update-types: ["version-update:semver-major"]

  # GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      # Group all GitHub Actions together
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
